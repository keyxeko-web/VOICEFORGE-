name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          NEXT_EXPORT: "1"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceforge-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release (signed) APK ─────────────────────────────────────────────
      # To enable signed APK for Play Store:
      # 1. Generate a keystore:
      #    keytool -genkey -v -keystore voiceforge.jks -alias voiceforge -keyalg RSA -keysize 2048 -validity 10000
      # 2. Encode it:
      #    base64 -w 0 voiceforge.jks
      # 3. Add to GitHub Secrets:
      #    KEYSTORE_BASE64   = <output of step 2>
      #    KEY_ALIAS         = voiceforge
      #    KEY_PASSWORD      = <your key password>
      #    STORE_PASSWORD    = <your store password>
      # 4. Uncomment the steps below.
      #
      # - name: Decode keystore
      #   run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/voiceforge.jks
